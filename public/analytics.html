<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Analytics — Expense Tracker Pro</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head"><span class="sidebar-head-icon">💰</span><span class="sidebar-head-name">ExpenseTracker</span><button class="sidebar-x btn">✕</button></div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html"  class="nav-link"><span class="nav-icon">📊</span>Dashboard</a>
      <a href="/expenses.html"   class="nav-link"><span class="nav-icon">📋</span>Expenses</a>
      <a href="/analytics.html"  class="nav-link active"><span class="nav-icon">📈</span>Analytics</a>
      <a href="/categories.html" class="nav-link"><span class="nav-icon">🏷️</span>Categories</a>
      <a href="/profile.html"    class="nav-link"><span class="nav-icon">👤</span>Profile</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user-chip"><div class="user-av" id="s-av"></div><div><div class="user-nm" id="s-nm"></div><div class="user-em" id="s-em"></div></div></div>
      <button class="btn-logout" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="topbar-hamburger btn">☰</button>
      <span class="topbar-title">Analytics</span>
    </header>
    <div class="page">
      <div class="page-head">
        <h1>Analytics</h1>
        <div class="month-nav">
          <button id="prev-m">‹</button>
          <span id="month-lbl"></span>
          <button id="next-m">›</button>
        </div>
      </div>
      <div class="two-col">
        <div class="card">
          <div class="card-head"><h3>6-Month Spending Trend</h3></div>
          <div id="bar-chart" style="padding-bottom:16px"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Spending by Category</h3></div>
          <div id="pie-list" class="pie-list"></div>
        </div>
      </div>

      <!-- Budget Alerts -->
      <div class="card" style="margin-top:14px">
        <div class="card-head">
          <h3>Budget Alerts</h3>
          <button class="btn btn-primary btn-sm" id="set-budget-btn">+ Set Budget</button>
        </div>
        <div id="budget-list" style="padding:14px 18px"></div>
      </div>
    </div>
  </div>
</div>

<!-- Set Budget Modal -->
<div class="overlay hidden" id="budget-overlay">
  <div class="modal" style="max-width:380px">
    <div class="modal-head">
      <h3>Set Monthly Budget</h3>
      <button class="modal-x btn" id="budget-x">✕</button>
    </div>
    <div id="budget-alert" class="alert hidden"></div>
    <div class="field"><label>Category</label>
      <select id="b-cat"><option value="">Select category</option></select>
    </div>
    <div class="field"><label>Monthly Limit (₹)</label>
      <input type="number" id="b-amt" placeholder="e.g. 5000" min="1" step="1">
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline btn-sm" id="budget-cancel">Cancel</button>
      <button class="btn btn-primary btn-sm" id="budget-save">Save Budget</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
var cm=new Date().getMonth()+1, cy=new Date().getFullYear();
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONTHS_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function setLbl(){ document.getElementById('month-lbl').textContent=MONTHS[cm-1]+' '+cy; }
document.getElementById('prev-m').onclick=function(){cm--;if(cm<1){cm=12;cy--;}setLbl();load();};
document.getElementById('next-m').onclick=function(){cm++;if(cm>12){cm=1;cy++;}setLbl();load();};

async function load(){
  try{
    var r=await api('GET','/api/expenses/analytics/summary?month='+cm+'&year='+cy);
    var s=r.summary;

    // Bar chart — use pixel heights (120px usable area) so percentages work correctly
    var trend=s.monthlyTrend||[];
    var bc=document.getElementById('bar-chart');
    if(!trend.length){ bc.innerHTML='<div class="empty"><p>Not enough data yet</p></div>'; }
    else{
      var max=Math.max(...trend.map(t=>parseFloat(t.total)),1);
      var BAR_H=120;
      bc.innerHTML='<div class="bar-chart">'+trend.map(t=>{
        var px=Math.max(4,Math.round(parseFloat(t.total)/max*BAR_H));
        return '<div class="bar-item"><div class="bar-val">'+fmtINRShort(t.total)+'</div><div class="bar-body" style="height:'+px+'px"></div><div class="bar-lbl">'+MONTHS_SHORT[t.month-1]+'</div></div>';
      }).join('')+'</div>';
    }

    // Pie / legend
    var active=s.byCategory.filter(c=>c.total>0).slice(0,8);
    var total=s.monthly.total;
    var pl=document.getElementById('pie-list');
    if(!active.length){ pl.innerHTML='<div class="empty"><p>No data this month</p></div>'; }
    else{ pl.innerHTML=active.map(c=>{
      var pct=total>0?(c.total/total*100).toFixed(1):0;
      return '<div class="pie-row"><div class="pie-dot" style="background:'+c.color+'"></div><span style="font-size:16px">'+(c.icon||'💰')+'</span><span class="pie-name">'+c.name+'</span><span class="pie-pct">'+pct+'%</span><span class="pie-amt">'+fmtINR(c.total)+'</span></div>';
    }).join(''); }
  }catch(e){}
}

var allCats = [];

async function loadBudgets() {
  try {
    var rb = await api('GET', '/api/budgets?month='+cm+'&year='+cy);
    var rs = await api('GET', '/api/expenses/analytics/summary?month='+cm+'&year='+cy);
    var spent = {};
    (rs.summary?.byCategory||[]).forEach(c=>{ spent[c.name]=parseFloat(c.total)||0; });

    var bl = document.getElementById('budget-list');
    var budgets = rb.budgets||[];
    if(!budgets.length){
      bl.innerHTML='<div style="color:var(--text3);font-size:0.85rem;padding:8px 0">No budgets set for this month. Click "+ Set Budget" to add one.</div>';
      return;
    }
    bl.innerHTML = budgets.map(function(b){
      var s = spent[b.category_name]||0;
      var pct = Math.min(100,(s/parseFloat(b.amount)*100)).toFixed(0);
      var over = s > parseFloat(b.amount);
      var color = over ? 'var(--red)' : pct>=80 ? '#f59e0b' : 'var(--green)';
      var status = over ? '🚨 Over budget!' : pct>=80 ? '⚠️ Near limit' : '✅ On track';
      return '<div style="margin-bottom:16px">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
          '<span style="font-size:0.9rem;font-weight:600">'+(b.category_icon||'💰')+' '+b.category_name+'</span>'+
          '<div style="display:flex;align-items:center;gap:12px">'+
            '<span style="font-size:0.78rem;color:'+color+'">'+status+'</span>'+
            '<span style="font-size:0.8rem;color:var(--text2)">'+fmtINR(s)+' / '+fmtINR(b.amount)+'</span>'+
            '<button class="icon-btn del" onclick="deleteBudget('+b.id+')" title="Remove budget" style="font-size:12px;padding:3px 6px">✕</button>'+
          '</div>'+
        '</div>'+
        '<div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden">'+
          '<div style="height:100%;width:'+pct+'%;background:'+color+';border-radius:3px;transition:width 0.5s"></div>'+
        '</div>'+
      '</div>';
    }).join('');
  } catch(e){}
}

async function deleteBudget(id){
  confirm('Remove this budget?', async function(){
    try{
      var r = await api('DELETE','/api/budgets/'+id);
      if(r.success){toast('Budget removed.');loadBudgets();}
      else toast(r.message,'err');
    }catch(e){toast('Failed.','err');}
  });
}

// Budget modal
document.getElementById('set-budget-btn').onclick = async function(){
  if(!allCats.length){
    var rc=await api('GET','/api/categories'); allCats=rc.categories||[];
    document.getElementById('b-cat').innerHTML='<option value="">Select category</option>'+
      allCats.map(c=>'<option value="'+c.id+'">'+c.icon+' '+c.name+'</option>').join('');
  }
  document.getElementById('budget-alert').className='alert hidden';
  document.getElementById('b-amt').value='';
  openModal('budget-overlay');
};
document.getElementById('budget-x').onclick      = ()=>closeModal('budget-overlay');
document.getElementById('budget-cancel').onclick  = ()=>closeModal('budget-overlay');
document.getElementById('budget-overlay').onclick = function(e){if(e.target===this)closeModal('budget-overlay');};

document.getElementById('budget-save').onclick = async function(){
  var cat_id = document.getElementById('b-cat').value;
  var amt    = document.getElementById('b-amt').value;
  var al     = document.getElementById('budget-alert');
  al.className = 'alert hidden';
  if(!cat_id||!amt){al.textContent='Please select a category and enter an amount.';al.className='alert alert-error';return;}
  this.disabled=true; this.textContent='Saving…';
  try{
    var r = await api('POST','/api/budgets',{category_id:parseInt(cat_id),amount:parseFloat(amt),month:cm,year:cy});
    if(r.success){closeModal('budget-overlay');toast('Budget saved!');loadBudgets();}
    else{al.textContent=r.message;al.className='alert alert-error';}
  }catch(e){al.textContent='Failed.';al.className='alert alert-error';}
  this.disabled=false; this.textContent='Save Budget';
};

setLbl();
initApp().then(function(){ load(); loadBudgets(); });
</script>
</body>
</html>
